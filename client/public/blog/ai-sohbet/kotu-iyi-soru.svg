<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
  <title id="t">Belirsiz soru ile net soru karşılaştırması</title>
  <desc id="d">Solda "Bana bir e-posta yaz" gibi belirsiz bir soru ve genel bir sonuç; sağda kim olduğunuzu, kime yazdığınızı, uzunluk ve tonu belirten net bir soru ve kullanıma hazır bir sonuç.</desc>
  <style>
    text{font-family:'Plus Jakarta Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#1a1f2e}
    .h{font-size:34px;font-weight:800}
    .lbl{font-size:23px;font-weight:800}
    .b{font-size:22px;font-weight:500}
    .s{font-size:19px;fill:#5a6377}
    .chip{font-size:17px;font-weight:700}
  </style>
  <rect width="1000" height="640" rx="28" fill="#fff7ed"/>
  <text x="500" y="62" text-anchor="middle" class="h">Aynı istek, iki farklı soru</text>

  <!-- Sol: belirsiz -->
  <rect x="40" y="100" width="430" height="500" rx="22" fill="#fff" stroke="#fecaca" stroke-width="3"/>
  <circle cx="82" cy="146" r="20" fill="#fee2e2"/>
  <text x="82" y="154" text-anchor="middle" class="lbl" style="fill:#dc2626">✕</text>
  <text x="114" y="154" class="lbl" style="fill:#dc2626">Belirsiz soru</text>
  <rect x="70" y="190" width="370" height="70" rx="18" fill="#f1f2f6"/>
  <text x="94" y="233" class="b">“Bana bir e-posta yaz.”</text>
  <line x1="70" y1="300" x2="440" y2="300" stroke="#f1f2f6" stroke-width="2"/>
  <text x="70" y="342" class="lbl" style="font-size:20px">Ne olur?</text>
  <text x="70" y="380" class="s">Yapay zekâ kime, neden ve hangi</text>
  <text x="70" y="408" class="s">tonda yazacağını tahmin etmek</text>
  <text x="70" y="436" class="s">zorunda kalır.</text>
  <rect x="70" y="470" width="370" height="96" rx="16" fill="#fef2f2"/>
  <text x="92" y="508" class="b" style="font-size:20px;fill:#b91c1c;font-weight:700">Sonuç: Genel, kalıp bir metin.</text>
  <text x="92" y="540" class="s" style="fill:#b91c1c">Baştan yazmanız gerekir.</text>

  <!-- Sağ: net -->
  <rect x="530" y="100" width="430" height="500" rx="22" fill="#fff" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="572" cy="146" r="20" fill="#dcfce7"/>
  <text x="572" y="154" text-anchor="middle" class="lbl" style="fill:#16a34a">✓</text>
  <text x="604" y="154" class="lbl" style="fill:#16a34a">Net soru</text>
  <rect x="560" y="182" width="370" height="200" rx="18" fill="#ffedd5"/>
  <text x="582" y="218" class="b" style="font-size:19.5px">“Bir tekstil firmasında satış</text>
  <text x="582" y="246" class="b" style="font-size:19.5px">müdürüyüm. Almanya’daki yeni</text>
  <text x="582" y="274" class="b" style="font-size:19.5px">bir müşteriye, geçen hafta yolla-</text>
  <text x="582" y="302" class="b" style="font-size:19.5px">dığımız numuneler için kibar bir</text>
  <text x="582" y="330" class="b" style="font-size:19.5px">takip e-postası yaz. En fazla</text>
  <text x="582" y="358" class="b" style="font-size:19.5px">120 kelime, samimi ama resmî.”</text>

  <g>
    <rect x="560" y="398" width="104" height="34" rx="17" fill="#fed7aa"/><text x="612" y="421" text-anchor="middle" class="chip" style="fill:#c2410c">Kimsiniz</text>
    <rect x="672" y="398" width="76" height="34" rx="17" fill="#fed7aa"/><text x="710" y="421" text-anchor="middle" class="chip" style="fill:#c2410c">Kime</text>
    <rect x="756" y="398" width="68" height="34" rx="17" fill="#fed7aa"/><text x="790" y="421" text-anchor="middle" class="chip" style="fill:#c2410c">Ne</text>
    <rect x="832" y="398" width="98" height="34" rx="17" fill="#fed7aa"/><text x="881" y="421" text-anchor="middle" class="chip" style="fill:#c2410c">Uzunluk</text>
  </g>

  <rect x="560" y="470" width="370" height="96" rx="16" fill="#f0fdf4"/>
  <text x="582" y="508" class="b" style="font-size:20px;fill:#15803d;font-weight:700">Sonuç: Kullanıma hazır taslak.</text>
  <text x="582" y="540" class="s" style="fill:#15803d">Küçük düzeltmeyle gönderilir.</text>
</svg>
