services:
  site-sayaci:
    build: ./site-sayaci
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    expose: ["3806"]
    networks: [coolify]
    volumes:
      - private:/var/lib/site-sayaci
      - aggregate:/var/lib/site-sayaci/out
    environment:
      SITE_ID: thirdhandai
      SITE_ORIGIN: https://thirdhand.com.tr
      SITE_VISITS_ENABLED: "${SITE_VISITS_ENABLED:-0}"
    labels:
      com.seymata.site-visits.app: thirdhandai
      com.seymata.site-visits.host: thirdhand.com.tr
      com.seymata.site-visits.schema: '1'
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.routers.site-visits-thirdhandai.rule: "Host(`thirdhand.com.tr`) && (Path(`/.well-known/site-visits/client.mjs`) || Path(`/.well-known/site-visits/page`))"
      traefik.http.routers.site-visits-thirdhandai.entrypoints: https
      traefik.http.routers.site-visits-thirdhandai.tls: 'true'
      traefik.http.routers.site-visits-thirdhandai.service: site-visits-thirdhandai
      traefik.http.routers.site-visits-thirdhandai.middlewares: site-visits-thirdhandai-privacy
      traefik.http.services.site-visits-thirdhandai.loadbalancer.server.port: '3806'
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.Cookie: ''
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.Authorization: ''
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.Referer: ''
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.Forwarded: ''
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.X-Forwarded-For: ''
      traefik.http.middlewares.site-visits-thirdhandai-privacy.headers.customrequestheaders.X-Real-IP: ''
networks:
  coolify:
    external: true
    name: coolify
volumes:
  private:
    name: site-visits-thirdhandai-private
  aggregate:
    name: site-visits-thirdhandai-out
